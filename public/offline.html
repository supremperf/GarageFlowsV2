<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GarageFlow — Hors ligne</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0f1629; color: #e2e8f0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      padding: 24px; text-align: center;
    }
    .card { max-width: 420px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #f59e0b; display: inline-block; margin-right: 8px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #94a3b8; line-height: 1.6; font-size: 14px; margin: 0 0 20px; }
    button {
      background: #2563eb; color: #fff; border: none; border-radius: 10px; padding: 11px 20px;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1><span class="dot"></span>Vous êtes hors ligne</h1>
    <p>
      GarageFlow n'a pas pu joindre le serveur. Vérifiez votre connexion internet.
      Vos actions ne sont enregistrées sur le serveur qu'une fois la connexion rétablie.
    </p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
