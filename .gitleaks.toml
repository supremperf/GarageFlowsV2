# Configuration Gitleaks — analyse des secrets du dépôt GarageFlow.
# On étend le jeu de règles par défaut et on ajoute un allowlist ciblé pour les
# valeurs qui NE SONT PAS des secrets exploitables : clés PUBLIQUES embarquées
# (sûres à distribuer) et listes de détection de valeurs faibles (auth-secret.ts,
# health/route.ts) qui existent précisément pour BANNIR ces chaînes.

[extend]
useDefault = true

[allowlist]
description = "Faux positifs : clés publiques, listes de détection, placeholders"
regexes = [
  # Ancien secret partagé — RÉVOQUÉ/ROTÉ (voir docs/SECRETS_ROTATION.md). Présent
  # uniquement dans les listes de détection qui servent à le refuser.
  '''gf-electron-local-secret-2026-xK9mP3qR''',
  '''fallback-(dev|portal)-secret-change-in-production''',
  '''CHANGE_ME[_A-Za-z0-9]*''',
  '''REPLACE_WITH_YOUR_PUBLIC_KEY''',
  # En-tête ASN.1 SubjectPublicKeyInfo d'une clé PUBLIQUE EC P-256 (secp256r1),
  # embarquée pour vérifier les signatures de licence/MàJ. Une valeur commençant
  # par cet en-tête est PUBLIQUE (sûre à distribuer) — jamais une clé privée ni un
  # secret. Couvre la clé inline d'electron/main.js et ses rotations.
  '''MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE[A-Za-z0-9+/=]+''',
  # Valeurs FIXTURES de test (jamais des secrets réels) — utilisées pour prouver
  # le comportement des routes/scripts avec une clé factice déterministe.
  '''test-api-key-strong-[0-9]+''',
  '''parity-test-secret-[0-9]+''',
  # Fixtures des suites d'intégration (mots de passe / secrets / jetons factices,
  # jamais émis ni déployés) — chacune nommée explicitement, pas d'exemption
  # globale des fichiers de test.
  '''Y2xlLWRlLXNhdXZlZ2FyZGUtdHJlcy1mb3J0ZQ==''',
  '''mauvaise-cle-0123456789abcdef''',
  '''NouveauMotDePasse12''',
  '''secret-de-test-signature-devis-0123456789abcdef''',
  '''GF2\.licence-garage-de-recette''',
  '''MonNouveauMotDePasse2026''',
  '''GF2\.jeton\.mecanicien''',
  '''GF2\.fixture\.signature''',
  '''eyJhbGciOiJIUzI1NiJ9\.eyJ0eXAiOiJwb3J0YWwifQ\.sig''',
  # EXPRESSION DE CODE, pas une valeur. `generic-api-key` capture le TEXTE
  # « aides.VALEURS_TEST.hex_32 » lorsqu'il suit un nom de variable sensible. La
  # valeur réelle est calculée à l'exécution par une suite arithmétique
  # déterministe (« configuation automatique/tests/helpers.js »), et n'est donc
  # jamais écrite dans le dépôt. La source a été corrigée pour sortir cette
  # expression de l'objet littéral ; cette regex ne couvre plus que la CITATION
  # qu'en fait un journal de preuves MASTER 6, immuable par mandat.
  # Exemption d'UNE chaîne exacte : aucun fichier n'est soustrait au scan.
  '''aides\.VALEURS_TEST\.hex_32''',
]
# Les fichiers auth-secret, health et public-key ne sont PLUS exclus en entier :
# seuls leurs littéraux publics/faibles connus sont couverts par les regexes.
# Un futur vrai secret ajouté à ces sources doit rester détectable.
paths = [
  # Test de redaction : contient VOLONTAIREMENT des chaînes qui ressemblent à des
  # secrets (NEXTAUTH_SECRET=…, password=…, postgresql://user:pass@…) afin de
  # PROUVER qu'elles sont masquées. Aucune de ces valeurs n'est un secret réel.
  '''src/lib/__tests__/redact\.test\.ts''',
  '''\.env\.example''',
  # Faux positif documentaire ISOLÉ : un exemple de chaîne de LOG (pas un secret)
  # dans ce rapport historique confond le heuristique generic-api-key. Exemption
  # d'UN fichier précis — sans commune mesure avec l'ancien « .*\.md » global.
  '''docs/AUDIT_FINALISATION_2026-08\.md''',
  # NB : PLUS d'exemption globale « .*\.md » (AUD-032) — elle soustrayait ~55
  # runbooks au scan (dont les procédures de rotation où un secret se colle par
  # accident). Les rares faux positifs documentaires sont couverts ci-dessus par
  # des regexes ciblées et cette unique exemption de fichier.
]
stopwords = ["BEGIN PUBLIC KEY"]
