<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GarageFlows</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 520px;
      height: 320px;
      background: #0f1629;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      user-select: none;
      -webkit-app-region: drag;
    }

    /* Ambient glow blobs */
    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      pointer-events: none;
    }
    .glow-blue  { width: 280px; height: 280px; background: #2563eb; opacity: 0.18; top: -80px;  left: -60px; }
    .glow-orange{ width: 200px; height: 200px; background: #94a3b8; opacity: 0.12; bottom: -60px; right: -40px; }
    .glow-indigo{ width: 180px; height: 180px; background: #6366f1; opacity: 0.1;  bottom: 0; left: 30%; }

    /* Logo container */
    .logo-wrap {
      position: relative;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-4px); }
    }

    /* Gear ring */
    .gear-ring {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 50%, #2563eb 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 0 1px rgba(96,165,250,0.2),
        0 8px 32px rgba(37,99,235,0.4),
        0 2px 8px rgba(0,0,0,0.5);
      position: relative;
    }

    /* Gear teeth using clip-path */
    .gear-ring::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 24px;
      background: conic-gradient(
        #1e40af 0deg,   transparent 0deg,
        transparent 20deg, #1e40af 20deg,
        #1e40af 45deg,  transparent 45deg,
        transparent 65deg, #1e40af 65deg,
        #1e40af 90deg,  transparent 90deg,
        transparent 110deg, #1e40af 110deg,
        #1e40af 135deg, transparent 135deg,
        transparent 155deg, #1e40af 155deg,
        #1e40af 180deg, transparent 180deg,
        transparent 200deg, #1e40af 200deg,
        #1e40af 225deg, transparent 225deg,
        transparent 245deg, #1e40af 245deg,
        #1e40af 270deg, transparent 270deg,
        transparent 290deg, #1e40af 290deg,
        #1e40af 315deg, transparent 315deg,
        transparent 335deg, #1e40af 335deg,
        #1e40af 360deg
      );
      border-radius: 50%;
      clip-path: polygon(
        47% 0%, 53% 0%, 55% 8%, 62% 4%, 66% 9%, 60% 15%,
        65% 22%, 70% 19%, 73% 25%, 67% 29%,
        70% 37%, 76% 37%, 76% 44%, 70% 44%,
        67% 52%, 73% 56%, 70% 62%, 65% 59%,
        60% 66%, 66% 72%, 62% 77%, 55% 73%,
        53% 81%, 47% 81%, 45% 73%, 38% 77%,
        34% 72%, 40% 66%, 35% 59%, 30% 62%,
        27% 56%, 33% 52%, 30% 44%, 24% 44%,
        24% 37%, 30% 37%, 33% 29%, 27% 25%,
        30% 19%, 35% 22%, 40% 15%, 34% 9%,
        38% 4%, 45% 8%
      );
      z-index: 0;
      opacity: 0.6;
    }

    .letter-g {
      font-size: 46px;
      font-weight: 900;
      font-style: italic;
      background: linear-gradient(135deg, #93c5fd, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
      z-index: 1;
      letter-spacing: -2px;
      line-height: 1;
    }

    /* Orange swoosh accent */
    .swoosh {
      position: absolute;
      top: -4px;
      right: -12px;
      width: 20px;
      height: 50px;
    }

    /* App name */
    .app-name {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -1px;
      color: #fff;
      line-height: 1;
    }
    .app-name span { color: #3b82f6; }

    .tagline {
      font-size: 10px;
      color: #475569;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-top: 6px;
    }

    /* Progress */
    .progress-wrap {
      margin-top: 36px;
      width: 220px;
    }
    .progress-track {
      height: 3px;
      background: rgba(255,255,255,0.07);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #1d4ed8, #3b82f6, #60a5fa);
      width: 0%;
      animation: loading 3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes loading {
      0%   { width: 0%; }
      15%  { width: 20%; }
      40%  { width: 55%; }
      70%  { width: 80%; }
      85%  { width: 92%; }
      100% { width: 100%; }
    }

    .status-text {
      font-size: 11px;
      color: #64748b;
      margin-top: 10px;
      text-align: center;
      animation: blink 1.8s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 0.5; }
      50%       { opacity: 1; }
    }

    /* Version badge */
    .version {
      position: absolute;
      bottom: 14px;
      right: 18px;
      font-size: 10px;
      color: #1e2d4e;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Bottom border accent */
    .border-accent {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #1d4ed8, #3b82f6, #cbd5e1, transparent);
    }
  </style>
</head>

  <!-- Title -->
  <div class="app-name">Garage<span>Flows</span></div>
  <div class="tagline">Planning intelligent</div>

  <!-- Progress -->
  <div class="progress-wrap">
    <div class="progress-track">
      <div class="progress-bar" id="bar"></div>
    </div>
    <div class="status-text" id="status">Initialisation…</div>
  </div>

  <div class="version">v<span id="ver">—</span></div>
  <div class="border-accent"></div>

  <script>
    // Version réelle transmise par le processus principal (loadFile + query).
    // Elle était figée à « 1.0.0 » dans le HTML : tout utilisateur d'une version
    // ultérieure voyait donc un numéro faux à chaque démarrage. Le splash tourne
    // en sandbox avec contextIsolation, il ne peut pas lire package.json lui-même.
    try {
      const v = new URLSearchParams(location.search).get('v')
      if (v) document.getElementById('ver').textContent = v
    } catch (_) { /* le splash ne doit jamais bloquer le démarrage */ }

    // Cycle through status messages
    const messages = [
      'Initialisation…',
      'Chargement de la base de données…',
      'Démarrage du serveur…',
      'Préparation de l\'interface…',
      'Presque prêt…',
    ]
    let idx = 0
    const status = document.getElementById('status')
    const interval = setInterval(() => {
      idx = (idx + 1) % messages.length
      status.textContent = messages[idx]
    }, 600)

    // Close interval after animation ends
    setTimeout(() => clearInterval(interval), 3200)
  </script>
