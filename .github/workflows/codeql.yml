# SAST — GitHub CodeQL (JavaScript/TypeScript).
# Configure une réponse à AUD-048 ; exécution et alertes restent à vérifier.
# Analyse le code à
# chaque PR, à chaque push sur les branches principales, et une fois par semaine
# (les bases CodeQL évoluent — un scan planifié rattrape les nouvelles règles).
#
# Aucune alerte n'est supprimée pour « faire du vert » : les faux positifs se
# traitent via des dismissals justifiés dans l'onglet Security, jamais en retirant
# la règle.
name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '27 3 * * 1' # lundi 03:27 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write # requis pour publier les résultats CodeQL
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cf12ceefebab2c867b9c35d7f907e059681d37ab # v3
        with:
          languages: ${{ matrix.language }}
          # security-extended ajoute des requêtes de sécurité au-delà du set par
          # défaut (injection, path traversal, SSRF, crypto faible, etc.).
          queries: security-extended

      # Projet Next.js/TypeScript : pas de compilation à piloter pour CodeQL JS/TS
      # (analyse directe des sources). Autobuild reste sûr et no-op ici.
      - name: Autobuild
        uses: github/codeql-action/autobuild@cf12ceefebab2c867b9c35d7f907e059681d37ab # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cf12ceefebab2c867b9c35d7f907e059681d37ab # v3
        with:
          category: '/language:${{ matrix.language }}'
          output: '${{ runner.temp }}/garageflows-codeql-results'

      - name: Safe complete CodeQL rule and data-flow inventory (no snippets)
        if: always()
        run: |
          node --test tests/codeql-inventory.test.cjs
          node scripts/report-codeql-locations.cjs "$RUNNER_TEMP/garageflows-codeql-results"
