name: CI

on:
  push:
    branches: [main, master, develop, 'claude/**', 'integration/**', 'arena/**']
  pull_request:
    branches: [main, master, develop]
  # Déclenchement manuel du release gate complet (validation avant tag/release).
  workflow_dispatch:

# Moindre privilège : aucun job ne pousse, ne commente ni n'appelle l'API GitHub
# (Gitleaks scanne l'arbre local). Le GITHUB_TOKEN n'a donc besoin que de la
# lecture du contenu — on retire tout droit d'écriture par défaut.
permissions:
  contents: read

jobs:
  dependency-security:
    name: Full dependency tree — zero vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@11.16.0
      # This independent audit needs no native engines or install hooks.
      # Other jobs retain normal npm ci, Prisma generation and functional tests.
      - run: npm ci --ignore-scripts
      - run: npm ls --all
      - run: npm run test:audit
      - run: npm run test:release-safety
      - run: npm run audit:strict

  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Scan de l'ARBRE COURANT (fichiers suivis), PAS de l'historique git. Les
      # secrets historiques sont documentés comme rotés (docs/SECRETS_ROTATION.md).
      # Ce mode est IDENTIQUE sur push et pull_request et n'appelle aucune API
      # GitHub — contrairement à gitleaks-action sur les PR, qui exige la
      # permission pull-requests:read et rescanne toute la plage de commits
      # (rouvrant de faux positifs historiques). L'allowlist ciblé de
      # .gitleaks.toml (clés PUBLIQUES, listes de détection, test de redaction)
      # s'applique.
      - name: Install gitleaks
        run: |
          # No root-owned installation directory or secret-bearing redirect URL.
          tool_dir="$RUNNER_TEMP/garageflows-gitleaks"
          mkdir -p "$tool_dir"
          download() {
            label="$1"; target="$2"; url="$3"
            if http=$(curl -fsSL --write-out '%{http_code}' -o "$target" "$url" 2>/dev/null); then
              echo "::notice title=Gitleaks installer::$label downloaded; HTTP $http"
            else
              code=$?
              echo "::error title=Gitleaks installer::$label download failed; curl exit $code; HTTP $http. Redirect URLs and response bodies withheld."
              exit "$code"
            fi
          }
          download archive "$tool_dir/gitleaks_8.24.3_linux_x64.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          download checksums "$tool_dir/checksums.txt" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_checksums.txt
          cd "$tool_dir"
          grep '  gitleaks_8.24.3_linux_x64.tar.gz$' checksums.txt | sha256sum --check --strict
          echo "::notice title=Gitleaks installer::Official archive checksum verified"
          tar -xzf gitleaks_8.24.3_linux_x64.tar.gz gitleaks
          echo "$tool_dir" >> "$GITHUB_PATH"
          "$tool_dir/gitleaks" version
      - name: Gitleaks — scan working tree
        # Same official scope/exit, plus location-only annotations readable through
        # GitHub API when the signed log-download endpoint is unavailable.
        run: |
          node --test tests/secret-scan-policy.test.cjs
          node scripts/gitleaks-ci.cjs

  check:
    name: Type-check, Lint & Test (desktop SQLite + serveur PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # ── Services réels pour les tests d'intégration ──────────────────────────
    # postgres : migrations serveur sur base VIDE + tests de concurrence seats.
    # redis    : preuve du rate limiting distribué partagé entre instances.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: garageflow
          POSTGRES_PASSWORD: garageflow_ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U garageflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node ≥ 22.5 OBLIGATOIRE : node:sqlite est utilisé par les tests de
          # migration (vitest) et les gardes du modèle SQLite (check:sqlite-template).
          node-version: 22
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@11.16.0

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Version consistency (SemVer)
        run: node scripts/check-version.js

      - name: Validate Prisma schemas (desktop + serveur)
        # Chaque schéma est validé avec une URL de SON provider (sqlite / postgres).
        run: |
          DATABASE_URL="file:./dev.db" npx prisma validate
          DATABASE_URL="postgresql://garageflow:garageflow_ci@127.0.0.1:5432/postgres" \
            DIRECT_URL="postgresql://garageflow:garageflow_ci@127.0.0.1:5432/postgres" \
            npx prisma validate --schema prisma/server/schema.prisma

      - name: Generate Prisma clients (desktop + serveur)
        run: |
          DATABASE_URL="file:./dev.db" npx prisma generate
          DATABASE_URL="postgresql://garageflow:garageflow_ci@127.0.0.1:5432/postgres" \
            DIRECT_URL="postgresql://garageflow:garageflow_ci@127.0.0.1:5432/postgres" \
            npx prisma generate --schema prisma/server/schema.prisma

      - name: Copilot native regressions (six suites, 54 assertions)
        run: node scripts/validate-copilot-native.cjs

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      # Garde-fou marque : « GarageFlows » partout dans le visible (exceptions techniques précises).
      - name: Branding consistency (strict)
        run: node scripts/check-branding.mjs

      # Garde-fou PWA : manifestes cohérents + icônes aux dimensions RÉELLES déclarées.
      - name: PWA manifests & icon dimensions
        run: node scripts/check-pwa.mjs

      # Garde-fou monnaie STRICT : ZÉRO champ monétaire Float dans les schémas.
      - name: Money fields (ZERO monetary Float)
        run: node scripts/check-money-fields.mjs

      # Garde-fou calculs : aucun calcul financier direct hors couche centrale.
      - name: Money calculations (no direct float math)
        run: node scripts/check-money-calculations.mjs

      # Garde-fou JSON monétaires : toute écriture de worksJson/partsJson/linesJson
      # passe par les sérialiseurs v2 (entiers exacts) — zéro flottant persisté.
      - name: Money JSON (v2 writers only)
        run: node scripts/check-money-json.mjs

      # Garde-fou sûreté migrations : runner atomique fail-closed, DROP prouvé,
      # ordre Electron sauvegarde → serveur → migration → fenêtre.
      - name: Migration safety invariants
        run: node scripts/check-migration-safety.mjs

      # Garde-fou modèle SQLite : intégrité réelle + baseline complète + checksums
      # + schéma final (exécute node:sqlite sur prisma/garageflow-template.db).
      - name: SQLite template (integrity + baseline + checksums)
        run: node scripts/check-sqlite-template.mjs

      # Garde-fou migrations PostgreSQL : chaque DROP COLUMN a sa vérification
      # bloquante (bijection stricte, bloc de contrôle avant tout DROP).
      - name: PostgreSQL migrations (per-column verification)
        run: node scripts/check-postgres-migration-verification.mjs

      # Garde-fou docs : aucune affirmation de statut contradictoire dans un doc actif.
      - name: Docs consistency
        run: node scripts/check-docs-consistency.mjs

      - name: Critical security/licence files present & coherent
        run: node scripts/check-critical-files.js

      # ── Migrations PostgreSQL sur base VIDE (échec CI si une migration casse) ──
      - name: PostgreSQL migrations on empty database + smoke test
        run: node scripts/validate-server-db.js
        env:
          DATABASE_URL: postgresql://garageflow:garageflow_ci@127.0.0.1:5432/garageflow_ci_validate
          DIRECT_URL: postgresql://garageflow:garageflow_ci@127.0.0.1:5432/garageflow_ci_validate

      # ── Tests : unitaires (SQLite desktop) + intégration PostgreSQL/Redis ──
      # TEST_POSTGRES_URL active les tests de concurrence seats (base neuve par
      # exécution) ; TEST_REDIS_URL active la preuve multi-instance du rate
      # limiting. La CI ÉCHOUE si le plafond d'appareils peut être dépassé.
      - name: Python for real keygen integration (no silent fallback)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install hash-locked keygen test dependencies
        run: |
          python -m pip install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r tests/requirements-keygen.txt

      - name: Copilot budget guards and frozen validation integrity (offline)
        run: |
          node --test tests/copilot-phase4-evaluation.test.cjs
          node scripts/evaluate-copilot-phase4.cjs --verify-freeze

      - name: Tests (unit + integration)
        run: npm test
        env:
          DATABASE_URL: file:./dev.db
          NEXTAUTH_SECRET: ci-test-secret-not-for-production-0123456789
          NEXTAUTH_URL: http://localhost:4028
          TEST_POSTGRES_URL: postgresql://garageflow:garageflow_ci@127.0.0.1:5432/postgres
          TEST_REDIS_URL: 127.0.0.1:6379

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: file:./dev.db
          NEXTAUTH_SECRET: ci-test-secret-not-for-production-0123456789
          NEXTAUTH_URL: http://localhost:4028

      # Budget de performance du bundle client (fail-closed : exige le build
      # ci-dessus). Échoue si le JS client régresse au-delà de perf-budget.json.
      - name: Performance budget (client bundle)
        run: npm run check:perf-budget

      # Full tree, all severities, no allowlist and no swallowed exit status.
      - name: Dependency security regression tests
        run: npm run test:audit
      - name: Dependency audit gate (all packages, LOW through CRITICAL)
        run: node scripts/audit-ci.js

  e2e:
    name: E2E (Playwright — responsive, auto-démarrage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@11.16.0
      - name: Install dependencies (reproducible)
        run: npm ci
      - name: Install Playwright Chromium (+ deps)
        run: npx playwright install --with-deps chromium
      - name: Prepare local SQLite database
        run: cp prisma/garageflow-template.db prisma/dev.db
      # `npx playwright test` démarre l'app en mode dev via le webServer de
      # playwright.config.ts (mode production interdit SQLite — fail-closed).
      # Sans E2E_EMAIL/E2E_PASSWORD, seuls les tests PUBLICS (page de connexion,
      # responsive) s'exécutent ; les parcours authentifiés sont ignorés (skip).
      - name: Run E2E (public responsive suite)
        run: npx playwright test
        env:
          DATABASE_URL: file:./dev.db
          NEXTAUTH_SECRET: ci-e2e-secret-not-for-production-0123456789
          NEXTAUTH_URL: http://localhost:3000
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Dedicated non-production environment only; missing approval/fixtures fail
  # the aggregate gate instead of treating public responsive tests as auth proof.
  e2e-authenticated:
    name: Authenticated browser validation (approved staging only)
    runs-on: ubuntu-latest
    needs: [dependency-security, secrets, check, e2e]
    environment: e2e-staging
    timeout-minutes: 20
    env:
      BASE_URL: ${{ secrets.E2E_STAGING_URL }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_LICENSE: ${{ secrets.E2E_LICENSE }}
      E2E_NON_PRODUCTION: ${{ vars.E2E_NON_PRODUCTION }}
    steps:
      - name: Require explicitly approved non-production test target and fixtures
        shell: bash
        run: |
          node <<'NODE'
          for (const name of ['BASE_URL', 'E2E_EMAIL', 'E2E_PASSWORD', 'E2E_LICENSE']) {
            if (!process.env[name]) throw new Error(`Missing required staging input: ${name}`)
          }
          let target
          try { target = new URL(process.env.BASE_URL) } catch { throw new Error('Invalid staging URL') }
          const production = new Set(['garageflows.fr', 'www.garageflows.fr', 'app.garageflows.fr', 'api.garageflows.fr'])
          if (target.protocol !== 'https:' || target.username || target.password || production.has(target.hostname.toLowerCase().replace(/\.+$/, ''))) {
            throw new Error('Refused staging target: HTTPS/non-production host without URL credentials required')
          }
          if (process.env.E2E_NON_PRODUCTION !== 'true') throw new Error('Non-production environment approval required')
          NODE
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # No deployment, seed/reset or real production license is permitted here.
      # Use synthetic fixtures on the approved isolated staging environment.
      # Traces/storageState can contain session tokens: never upload them here.
      - run: npx playwright test

  # ── Release gate complet (manuel) ──────────────────────────────────────────
  # Porte de sortie V13 : une seule commande qui enchaîne tsc, lint, les 10
  # gardes, la suite de tests, les tests PostgreSQL/Redis RÉELS (services),
  # l'audit de dépendances, le build et le budget de perf. À déclencher avant
  # tout tag/release (workflow_dispatch) — les jobs par-PR ci-dessus restent
  # les « fast checks ».
  release-gate:
    name: Final release gate (full)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: garageflow
          POSTGRES_PASSWORD: garageflow_ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U garageflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@11.16.0
      - name: Install dependencies (reproducible)
        run: npm ci
      - name: Generate Prisma clients
        run: |
          npx prisma generate
          npx prisma generate --schema prisma/server/schema.prisma
      - name: Python for real keygen integration (no silent fallback)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install hash-locked keygen test dependencies
        run: |
          python -m pip install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r tests/requirements-keygen.txt

      - name: Run final release gate
        run: node scripts/final-release-gate.mjs
        env:
          DATABASE_URL: file:./dev.db
          NEXTAUTH_SECRET: ci-gate-secret-not-for-production-0123456789
          NEXTAUTH_URL: http://localhost:4028
          TEST_POSTGRES_URL: postgresql://garageflow:garageflow_ci@127.0.0.1:5432/postgres
          TEST_REDIS_URL: 127.0.0.1:6379

  windows-package:
    name: Windows candidate packaging and inspection (not publication)
    needs: [dependency-security, secrets, check, e2e]
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      # Restores the existing public anchor only: no private key, no rotation,
      # no independent attestation of the external publisher and no release.
      - run: node scripts/materialize-build-public-key.cjs
      - run: npm run check:public-key
      - run: npm run keys:check
      - run: node --test tests/package-prisma-resources.test.cjs tests/build-public-key.test.cjs tests/preload-listeners.test.cjs tests/preserve-legacy-dev-db.test.cjs
      - run: npm run dist
      - run: npm run check:perf-budget
      - name: Verify integrity against the actual packaged resources (required)
        run: npx vitest run src/__tests__/integrity-diagnostics.test.ts
        env:
          GF_REQUIRE_ARTIFACT_TEST: '1'
      - run: npm run release:verify-artifact

  required-validation:
    name: Required validation
    if: ${{ always() }}
    needs: [dependency-security, secrets, check, e2e, e2e-authenticated, windows-package]
    runs-on: ubuntu-latest
    steps:
      - name: Refuse failed, cancelled or skipped mandatory jobs
        shell: bash
        run: |
          test '${{ needs.dependency-security.result }}' = success
          test '${{ needs.secrets.result }}' = success
          test '${{ needs.check.result }}' = success
          test '${{ needs.e2e.result }}' = success
          test '${{ needs.e2e-authenticated.result }}' = success
          test '${{ needs.windows-package.result }}' = success
